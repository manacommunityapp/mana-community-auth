logging:
  file:
    name: ${LOG_DIR:/var/log/mana-auth-dev}/mana-auth.log

spring:
  application:
    name: mana-community-auth
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mana_auth_db}
    username: ${DB_USERNAME:mana}
    password: ${DB_PASSWORD:mana_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        default_schema: manacommunity
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:email-smtp.ap-south-1.amazonaws.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            protocols: TLSv1.2

server:
  port: ${SERVER_PORT:8083}

app:
  insert-sample-data: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://manacommunityhub.com,http://localhost:5173,http://localhost:3000}
  security:
    mock-auth-enabled: false
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
      issuer: ${JWT_ISSUER:mana-community}
